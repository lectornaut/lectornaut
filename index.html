<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>Lectornaut</title>
    <meta name="description" content="Lectornaut" />
  </head>
  <body>
    <div
      id="app"
      class="flex size-full overflow-auto overscroll-none scroll-smooth"
    >
      <div
        style="
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          mix-blend-mode: difference;
        "
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="36"
          height="36"
          fill="#fff"
          viewBox="0 0 24 24"
        >
          <style>
            .spinner {
              animation: spin 1.2s cubic-bezier(0.52, 0.6, 0.25, 0.99)
                infinite;
            }
            @keyframes spin {
              0% {
                r: 0;
                opacity: 1;
              }
              100% {
                r: 11px;
                opacity: 0;
              }
            }
          </style>
          <circle class="spinner" cx="12" cy="12" r="0" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
