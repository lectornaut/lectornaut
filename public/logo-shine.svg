<svg width="302" height="302" viewBox="0 0 302 302" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    /* Light appearance: ink-colored mark that shows the translucent backdrop through it */
    .base { fill: rgba(0, 0, 0, 0.30); }
    .hi   { stop-color: #1d1d1f; }
    .peak { stop-opacity: 0.62; }

    /* Dark appearance */
    @media (prefers-color-scheme: dark) {
      .base { fill: rgba(255, 255, 255, 0.32); }
      .hi   { stop-color: #fff; }
      .peak { stop-opacity: 0.92; }
    }

    .sweep {
      animation: sweep 2.8s cubic-bezier(0.45, 0, 0.25, 1) infinite;
    }
    @keyframes sweep {
      0%   { transform: translateX(-100px); }
      55%  { transform: translateX(400px); }
      100% { transform: translateX(400px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .sweep { animation: none; transform: translateX(150px); }
    }
  </style>

  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    class="hi" stop-opacity="0"/>
      <stop offset="0.5"  class="hi peak"/>
      <stop offset="1"    class="hi" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="logo-shape">
      <path d="M151 87L183 56L215.5 23H279V87L215 151H214.5L247 184L279 215V279H215L151 215L119 246L86.5 279H23V215L87 151H87.5L55 118L23 87V23H87L151 87Z"/>
    </clipPath>
  </defs>

  <!-- Dim base mark -->
  <path class="base" d="M151 87L183 56L215.5 23H279V87L215 151H214.5L247 184L279 215V279H215L151 215L119 246L86.5 279H23V215L87 151H87.5L55 118L23 87V23H87L151 87Z"/>

  <!-- Moving shine, clipped to the logo shape -->
  <g clip-path="url(#logo-shape)">
    <g class="sweep">
      <rect x="0" y="-10" width="100" height="322" fill="url(#band)" transform="skewX(-20)"/>
    </g>
  </g>
</svg>
