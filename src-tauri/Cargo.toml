[package]
name = "Lectornaut"
version = "0.0.0"
description = "Lectornaut App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "template_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.0", features = [] }
dotenvy = "0.15"

[dependencies]
# https://crates.io/crates/tauri/versions
# tauri v3 core dependency
# - macos-private-api: Required for advanced transparency and vibrancy effects on macOS.
# - tray-icon: Enables system tray functionality.
# - image-png: Required for processing PNG icons (like the tray icon).
tauri = { version = "3.0.0-alpha.0", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
# https://crates.io/crates/tauri-runtime-wry/versions
# tauri v3 selects the webview runtime explicitly (Builder::runtime); runtime-only features live here.
tauri-runtime-wry = { version = "3.0.0-alpha.0", features = ["macos-private-api"] }
# https://crates.io/crates/serde/versions
serde = { version = "1", features = ["derive"] }
# https://crates.io/crates/serde_json/versions
serde_json = "1"

# https://crates.io/crates/window-vibrancy/versions
window-vibrancy = "0.6.0"

# https://crates.io/crates/log/versions
log = "0.4"
# https://crates.io/crates/tauri-plugin-log/versions
tauri-plugin-log = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-clipboard-manager/versions
tauri-plugin-clipboard-manager = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-shell/versions
tauri-plugin-shell = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-opener/versions
tauri-plugin-opener = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-deep-link/versions
tauri-plugin-deep-link = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-process/versions
tauri-plugin-process = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-dialog/versions
tauri-plugin-dialog = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-fs/versions
tauri-plugin-fs = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-single-instance/versions
tauri-plugin-single-instance = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-notification/versions
tauri-plugin-notification = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-os/versions
tauri-plugin-os = "3.0.0-alpha.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# https://crates.io/crates/tauri-plugin-global-shortcut/versions
tauri-plugin-global-shortcut = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-positioner/versions
tauri-plugin-positioner = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-updater/versions
tauri-plugin-updater = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-window-state/versions
tauri-plugin-window-state = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-autostart/versions
tauri-plugin-autostart = "3.0.0-alpha.0"
# https://crates.io/crates/tauri-plugin-http/versions
tauri-plugin-http = { version = "3.0.0-alpha.0", features = ["json"] }

# URL parsing
url = "2.5"
# Async runtime utilities (if needed explicitly, though Tauri provides the runtime)
tokio = { version = "1", features = ["full"] }
# Rendering for Tray Icon
tiny-skia = "0.11"
# HMAC signing for App Check custom provider proof
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "NSPasteboard", "NSDragging", "NSAnimation", "NSAnimationContext", "NSWindow", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDate", "NSObjCRuntime", "NSRunLoop", "NSString", "NSTimer"] }

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
