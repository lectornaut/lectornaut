name: Deploy App Preview
on:
  push:
    branches:
      - "**"
      - "!release"
  workflow_dispatch:
concurrency:
  group: app-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy-preview:
    if: ${{ !contains(github.event.head_commit.message, 'skip app preview') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            identifier: "macos-arm64"
            target_dir: "aarch64-apple-darwin/"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            identifier: "macos-x64"
            target_dir: "x86_64-apple-darwin/"
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            identifier: "macos-universal"
            target_dir: "universal-apple-darwin/"
          - platform: "ubuntu-latest"
            args: ""
            identifier: "linux"
            target_dir: ""
          - platform: "windows-latest"
            args: ""
            identifier: "windows"
            target_dir: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_AUTH_DOMAIN: ${{ secrets.VITE_AUTH_DOMAIN }}
          VITE_DATABASE_URL: ${{ secrets.VITE_DATABASE_URL }}
          VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID }}
          VITE_STORAGE_BUCKET: ${{ secrets.VITE_STORAGE_BUCKET }}
          VITE_MESSAGING_SENDER_ID: ${{ secrets.VITE_MESSAGING_SENDER_ID }}
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          VITE_MEASUREMENT_ID: ${{ secrets.VITE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_ENTERPRISE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_KEY }}
          VITE_APPCHECK_DEBUG_TOKEN: ${{ secrets.VITE_APPCHECK_DEBUG_TOKEN }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_GOOGLE_AUTH_URL: ${{ secrets.VITE_GOOGLE_AUTH_URL }}
          VITE_GOOGLE_TOKEN_URL: ${{ secrets.VITE_GOOGLE_TOKEN_URL }}
          VITE_GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
          VITE_MICROSOFT_CLIENT_SECRET: ${{ secrets.VITE_MICROSOFT_CLIENT_SECRET }}
          VITE_MICROSOFT_AUTH_URL: ${{ secrets.VITE_MICROSOFT_AUTH_URL }}
          VITE_MICROSOFT_TOKEN_URL: ${{ secrets.VITE_MICROSOFT_TOKEN_URL }}
          VITE_MICROSOFT_REDIRECT_URI: ${{ secrets.VITE_MICROSOFT_REDIRECT_URI }}
          VITE_APPLE_CLIENT_ID: ${{ secrets.VITE_APPLE_CLIENT_ID }}
          VITE_APPLE_CLIENT_SECRET: ${{ secrets.VITE_APPLE_CLIENT_SECRET }}
          VITE_APPLE_AUTH_URL: ${{ secrets.VITE_APPLE_AUTH_URL }}
          VITE_APPLE_TOKEN_URL: ${{ secrets.VITE_APPLE_TOKEN_URL }}
          VITE_APPLE_REDIRECT_URI: ${{ secrets.VITE_APPLE_REDIRECT_URI }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.identifier }}
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/src-tauri/target/${{ matrix.target_dir }}release/bundle/dmg/*.dmg
            ${{ github.workspace }}/src-tauri/target/${{ matrix.target_dir }}release/bundle/macos/*.app
            ${{ github.workspace }}/src-tauri/target/${{ matrix.target_dir }}release/bundle/deb/*.deb
            ${{ github.workspace }}/src-tauri/target/${{ matrix.target_dir }}release/bundle/appimage/*.AppImage
            ${{ github.workspace }}/src-tauri/target/${{ matrix.target_dir }}release/bundle/msi/*.msi
            ${{ github.workspace }}/src-tauri/target/${{ matrix.target_dir }}release/bundle/nsis/*.exe
